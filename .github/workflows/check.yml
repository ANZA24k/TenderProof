name: Contract checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: GenVM lint
        run: genvm-lint check contracts/tenderproof.py
      - name: GenVM typecheck
        run: genvm-lint typecheck contracts/tenderproof.py
      - name: Direct-mode tests
        run: python -m pytest -q
      - name: Fixture integrity checks
        run: python scripts/verify_fixtures.py
